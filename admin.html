<!DOCTYPE html>
<html lang="ru" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Администратора | АО «Москоллектор»</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=your-api-key&lang=ru_RU" type="text/javascript"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        'dark-bg': '#0f172a',
                        'dark-card': '#1e293b',
                        moscow: { blue: '#0066CC', dark: '#0f172a', card: '#1e293b', purple: '#7C3AED' } 
                    }
                }
            }
        }
    </script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        .tab-btn.active { background-color: #7C3AED; color: white; border-bottom: 2px solid #A78BFA; }
        .icon-sun, .icon-moon { display: none; }
        html.dark .icon-sun { display: block; }
        html:not(.dark) .icon-moon { display: block; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-dark-bg text-gray-900 dark:text-gray-100 h-screen max-h-screen flex flex-col overflow-hidden">

    <!-- Top Admin Header -->
    <nav class="h-14 sm:h-16 bg-white dark:bg-dark-card border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 shrink-0 z-40 shadow-sm">
        <div class="flex items-center gap-3">
            <svg class="w-7 h-7 sm:w-8 sm:h-8 text-purple-600 dark:text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <div>
                <span class="font-bold text-base sm:text-lg block leading-tight">Панель Администратора</span>
                <span class="text-[10px] sm:text-xs text-gray-500 dark:text-gray-400">Управление системой и пользователями</span>
            </div>
            <span class="px-2 py-0.5 rounded text-xs bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200 font-medium hidden sm:inline-block">ADMIN</span>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="requestForecastUpdate()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow flex items-center gap-2">
                <svg id="forecastSpinner" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                <span class="hidden sm:inline">Пересчитать модель ML</span>
                <span class="sm:hidden">ML</span>
            </button>

            <button id="themeToggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                <svg class="icon-sun w-5 h-5 text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg>
                <svg class="icon-moon w-5 h-5 text-blue-500 dark:text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>

            <button onclick="logout()" class="text-red-500 hover:text-red-600 font-medium px-3 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-xs sm:text-sm">Выход</button>
        </div>
    </nav>

    <!-- Admin Navigation Tabs -->
    <div class="flex bg-white dark:bg-dark-card border-b border-gray-200 dark:border-gray-700 px-6 shrink-0 z-30 overflow-x-auto">
        <button onclick="switchAdminTab('monitoring')" id="admin-tab-monitoring" class="tab-btn active px-5 py-3 font-medium text-xs sm:text-sm transition flex items-center gap-2 border-r border-gray-200 dark:border-gray-700 whitespace-nowrap">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>
            Ситуационный мониторинг
        </button>
        <button onclick="switchAdminTab('sensors')" id="admin-tab-sensors" class="tab-btn px-5 py-3 font-medium text-xs sm:text-sm text-gray-500 dark:text-gray-400 transition flex items-center gap-2 border-r border-gray-200 dark:border-gray-700 whitespace-nowrap">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>
            Реестр датчиков и объектов
        </button>
        <button onclick="switchAdminTab('users')" id="admin-tab-users" class="tab-btn px-5 py-3 font-medium text-xs sm:text-sm text-gray-500 dark:text-gray-400 transition flex items-center gap-2 border-r border-gray-200 dark:border-gray-700 whitespace-nowrap">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            Управление пользователями
        </button>
        <button onclick="switchAdminTab('settings')" id="admin-tab-settings" class="tab-btn px-5 py-3 font-medium text-xs sm:text-sm text-gray-500 dark:text-gray-400 transition flex items-center gap-2 whitespace-nowrap">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
            Настройки ML и пороги
        </button>
    </div>

    <!-- Admin Content Views -->
    <div class="flex-1 min-h-0 overflow-hidden relative">

        <!-- ADMIN TAB 1: MONITORING -->
        <div id="admin-view-monitoring" class="absolute inset-0 flex flex-col md:flex-row min-h-0">
            <div class="h-1/2 md:h-full relative w-full md:w-[65%] bg-gray-800 flex flex-col min-h-0">
                <div id="map-container" class="w-full h-full flex-1 min-h-0"></div>
            </div>
            <div class="h-1/2 md:h-full w-full md:w-[35%] bg-white dark:bg-dark-card p-4 overflow-y-auto border-t md:border-t-0 md:border-l border-gray-200 dark:border-gray-700 space-y-3 min-h-0">
                <h3 class="font-bold text-xs uppercase text-gray-500 dark:text-gray-400">Активные угрозы сети</h3>
                <div id="admin-events-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- ADMIN TAB 2: SENSORS REGISTRY -->
        <div id="admin-view-sensors" class="absolute inset-0 bg-gray-100 dark:bg-dark-bg p-6 overflow-y-auto hidden">
            <div class="max-w-7xl mx-auto space-y-4">
                <div class="bg-white dark:bg-dark-card p-4 rounded-xl border border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between gap-3">
                    <input type="text" id="adminSensorSearch" oninput="renderAdminSensors()" placeholder="Поиск датчиков..." class="p-2 text-xs bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-lg text-gray-900 dark:text-white w-full sm:w-64 outline-none">
                    <div class="flex gap-2">
                        <select id="adminTypeFilter" onchange="renderAdminSensors()" class="p-2 text-xs bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-lg text-gray-900 dark:text-white outline-none">
                            <option value="all">Все типы</option>
                            <option value="gas">Газоанализаторы</option>
                            <option value="water">Уровень воды</option>
                            <option value="skud">СКУД</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white dark:bg-dark-card rounded-xl border border-gray-200 dark:border-gray-700 overflow-x-auto">
                    <table class="w-full text-left text-xs font-mono">
                        <thead class="bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400 uppercase text-[10px]">
                            <tr>
                                <th class="p-3">Датчик</th>
                                <th class="p-3">Объект</th>
                                <th class="p-3">Тип</th>
                                <th class="p-3">Показатель</th>
                                <th class="p-3">Статус</th>
                            </tr>
                        </thead>
                        <tbody id="adminSensorsTable" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ADMIN TAB 3: USERS MANAGEMENT -->
        <div id="admin-view-users" class="absolute inset-0 bg-gray-100 dark:bg-dark-bg p-6 overflow-y-auto hidden">
            <div class="max-w-5xl mx-auto space-y-4">
                <div class="bg-white dark:bg-dark-card p-4 rounded-xl border border-gray-200 dark:border-gray-700 flex justify-between items-center">
                    <h3 class="font-bold text-gray-900 dark:text-white">Пользователи системы</h3>
                    <button onclick="addUser()" class="bg-purple-600 px-3 py-1.5 rounded text-xs font-bold text-white hover:bg-purple-500 transition">+ Добавить сотрудника</button>
                </div>
                <div class="bg-white dark:bg-dark-card rounded-xl border border-gray-200 dark:border-gray-700 overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400 uppercase text-[10px]">
                            <tr>
                                <th class="p-3">ФИО</th>
                                <th class="p-3">Логин</th>
                                <th class="p-3">Роль</th>
                                <th class="p-3">Статус</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ADMIN TAB 4: SETTINGS -->
        <div id="admin-view-settings" class="absolute inset-0 bg-gray-100 dark:bg-dark-bg p-6 overflow-y-auto hidden">
            <div class="max-w-3xl mx-auto bg-white dark:bg-dark-card p-6 rounded-xl border border-gray-200 dark:border-gray-700 space-y-4">
                <h3 class="font-bold text-lg text-gray-900 dark:text-white">Настройки ML-модели и порогов</h3>
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Горизонт прогнозирования (часы)</label>
                    <input type="number" value="24" class="p-2 bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded text-xs w-full text-gray-900 dark:text-white outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Критический порог концентрации метана (CH4 %)</label>
                    <input type="text" value="1.5%" class="p-2 bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded text-xs w-full text-gray-900 dark:text-white outline-none">
                </div>
                <button onclick="alert('Настройки сохранены')" class="bg-purple-600 px-4 py-2 rounded text-xs font-bold text-white hover:bg-purple-500 transition">Сохранить параметры</button>
            </div>
        </div>

    </div>

    <script>
        const ThemeManager = {
            init() {
                const savedTheme = localStorage.getItem('ls_theme') || 'dark';
                this.setTheme(savedTheme);
                document.getElementById('themeToggle')?.addEventListener('click', () => {
                    const isDark = document.documentElement.classList.contains('dark');
                    this.setTheme(isDark ? 'light' : 'dark');
                });
            },
            setTheme(theme) {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('ls_theme', theme);
            }
        };

        const DataStore = {
            KEYS: { USERS: 'ls_users', EVENTS: 'ls_events', SESSION: 'ls_session', THEME: 'ls_theme' },
            getEvents() {
                const data = localStorage.getItem(this.KEYS.EVENTS);
                if (!data) {
                    const seed = [
                        { id: 'e1', title: 'Превышение метана', location: 'Вентшахта №8, ул. Тверская', sensor: 'Газоанализатор CH4-G2', severity: 'critical', forecast: 'Высокая вероятность аварии', status: 'active', coords: [55.7601, 37.6062] },
                        { id: 'e2', title: 'Уровень воды', location: 'Коллектор "Садовое кольцо", пикет 12', sensor: 'Датчик уровня воды LW-402', severity: 'critical', forecast: 'Превышение нормы', status: 'active', coords: [55.7480, 37.6250] },
                        { id: 'e3', title: 'Открытие люка', location: 'проспект Мира, у д. 45', sensor: 'Контактный датчик СКУД M-15', severity: 'warning', forecast: 'Срабатывание СКУД', status: 'active', coords: [55.7820, 37.6330] },
                        { id: 'e4', title: 'Температурный сдвиг', location: 'Коллектор "Яуза", сектор 4', sensor: 'Температурный сенсор T-12', severity: 'warning', forecast: 'Аномалия температуры', status: 'active', coords: [55.7550, 37.6500] }
                    ];
                    localStorage.setItem(this.KEYS.EVENTS, JSON.stringify(seed));
                    return seed;
                }
                return JSON.parse(data);
            },
            getUsers() {
                const data = localStorage.getItem(this.KEYS.USERS);
                if (!data) {
                    const seedUsers = [
                        { id: 1, fullName: 'Иванов А. Е.', login: 'dispatcher', role: 'dispatcher', active: true },
                        { id: 2, fullName: 'Администратор Системы', login: 'admin', role: 'admin', active: true }
                    ];
                    localStorage.setItem(this.KEYS.USERS, JSON.stringify(seedUsers));
                    return seedUsers;
                }
                return JSON.parse(data);
            }
        };

        const sensorCatalogAdmin = [
            { id: 'CH4-G2', name: 'Газоанализатор CH4-G2', object: 'Вентшахта №8, ул. Тверская', type: 'gas', value: '1.8%', status: 'online' },
            { id: 'LW-402', name: 'Датчик уровня воды LW-402', object: 'Коллектор "Садовое кольцо"', type: 'water', value: '+45 см', status: 'online' },
            { id: 'M-15', name: 'Контактный датчик СКУД M-15', object: 'проспект Мира, у д. 45', type: 'skud', value: 'ОТКРЫТО', status: 'online' }
        ];

        let myMap = null;

        function initAdminMap() {
            if (typeof ymaps === 'undefined') {
                document.getElementById('map-container').innerHTML = '<div class="p-6 text-center text-red-400 font-bold">Яндекс.Карты недоступны</div>';
                return;
            }
            ymaps.ready(() => {
                myMap = new ymaps.Map("map-container", { center: [55.751244, 37.618423], zoom: 11 });
                renderAdminMapMarkers();
            });
        }

        function renderAdminMapMarkers() {
            if (!myMap) return;
            myMap.geoObjects.removeAll();
            const events = DataStore.getEvents().filter(e => e.status === 'active');
            events.forEach(e => {
                const color = e.severity === 'critical' ? 'red' : 'orange';
                const placemark = new ymaps.Placemark(e.coords, { balloonContent: `<b>${e.title}</b><br>${e.sensor}` }, { preset: `islands#${color}DotIcon` });
                myMap.geoObjects.add(placemark);
            });
        }

        function renderAdminEventsList() {
            const container = document.getElementById('admin-events-list');
            container.innerHTML = '';
            const events = DataStore.getEvents().filter(e => e.status === 'active');
            
            events.forEach(e => {
                const card = document.createElement('div');
                card.className = 'p-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-slate-800 space-y-1';
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-red-500">${e.severity.toUpperCase()}</span>
                        <span class="text-gray-400 text-[10px]">${e.forecast}</span>
                    </div>
                    <div class="font-bold text-xs text-gray-900 dark:text-white">${e.location}</div>
                    <div class="text-[11px] text-gray-500 dark:text-gray-400">${e.sensor}</div>
                `;
                container.appendChild(card);
            });
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`admin-tab-${tab}`).classList.add('active');

            ['monitoring', 'sensors', 'users', 'settings'].forEach(v => {
                document.getElementById(`admin-view-${v}`).classList.add('hidden');
            });

            document.getElementById(`admin-view-${tab}`).classList.remove('hidden');
            
            if (tab === 'monitoring' && myMap) {
                setTimeout(() => myMap.container.fitToViewport(), 100);
            }
            if (tab === 'sensors') renderAdminSensors();
            if (tab === 'users') renderUsers();
        }

        function renderAdminSensors() {
            const tbody = document.getElementById('adminSensorsTable');
            tbody.innerHTML = '';
            const search = document.getElementById('adminSensorSearch').value.toLowerCase();
            const typeFilter = document.getElementById('adminTypeFilter').value;

            const filtered = sensorCatalogAdmin.filter(s => {
                const matchSearch = s.name.toLowerCase().includes(search) || s.object.toLowerCase().includes(search);
                const matchType = typeFilter === 'all' || s.type === typeFilter;
                return matchSearch && matchType;
            });

            filtered.forEach(s => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-800/50">
                        <td class="p-3 font-bold text-gray-900 dark:text-white">${s.name}</td>
                        <td class="p-3 text-gray-600 dark:text-gray-300">${s.object}</td>
                        <td class="p-3 uppercase">${s.type}</td>
                        <td class="p-3 font-bold text-red-500 dark:text-red-400">${s.value}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300">${s.status}</span></td>
                    </tr>
                `;
            });
        }

        function renderUsers() {
            const tbody = document.getElementById('usersTableBody');
            const users = DataStore.getUsers();
            tbody.innerHTML = '';
            users.forEach(u => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-800/50">
                        <td class="p-3 font-bold text-gray-900 dark:text-white">${u.fullName}</td>
                        <td class="p-3 text-gray-600 dark:text-gray-300">${u.login}</td>
                        <td class="p-3 uppercase text-purple-600 dark:text-purple-400 font-bold">${u.role}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300">Активен</span></td>
                    </tr>
                `;
            });
        }

        function addUser() {
            const login = prompt('Введите логин нового сотрудника:');
            if (!login) return;
            const users = DataStore.getUsers();
            if (users.some(u => u.login === login)) {
                alert('Пользователь с таким логином уже существует!');
                return;
            }
            users.push({ id: Date.now(), fullName: 'Оператор Диспетчерской', login: login, role: 'dispatcher', active: true });
            localStorage.setItem('ls_users', JSON.stringify(users));
            renderUsers();
        }

        function requestForecastUpdate() {
            const spinner = document.getElementById('forecastSpinner');
            spinner.classList.add('animate-spin');
            setTimeout(() => {
                spinner.classList.remove('animate-spin');
                alert('Модель ML успешно переобучена и обновила прогнозы.');
            }, 1000);
        }

        function logout() { localStorage.removeItem('ls_session'); window.location.href = 'index.html'; }

        window.onload = () => { 
            ThemeManager.init();
            initAdminMap(); 
            renderAdminEventsList();
        };
    </script>
</body>
</html>
