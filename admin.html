<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администрирование — ОДС «Москоллектор»</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0f172a', cardbg: '#1e293b' } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 dark:bg-darkbg text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="h-16 bg-white dark:bg-cardbg border-b border-slate-200 dark:border-slate-800 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600 text-white rounded-lg">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-base">Панель администратора безопасности</h1>
                <p class="text-xs text-slate-400">Управление учетными записями и доступом</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <a href="dispatcher.html" class="px-3 py-1.5 bg-indigo-600/10 text-indigo-400 border border-indigo-500/30 rounded-lg text-xs font-medium hover:bg-indigo-600/20">
                Открыть пульт диспетчера
            </a>
            <button onclick="logout()" class="text-xs text-red-400 hover:underline">Выйти</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-5xl mx-auto w-full space-y-6">
        
        <!-- Форма создания нового диспетчера -->
        <div class="bg-white dark:bg-cardbg p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <h2 class="font-bold text-sm flex items-center space-x-2">
                <i data-lucide="user-plus" class="w-4 h-4 text-indigo-500"></i>
                <span>Создать новую учетную запись диспетчера</span>
            </h2>

            <form id="addUserForm" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <input type="text" id="newFio" placeholder="ФИО сотрудника" required class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 outline-none">
                <input type="text" id="newUser" placeholder="Логин" required class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 outline-none">
                <input type="password" id="newPass" placeholder="Пароль" required class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 outline-none">
                <div class="sm:col-span-3 flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700">Выдать доступ</button>
                </div>
            </form>
        </div>

        <!-- Таблица пользователей -->
        <div class="bg-white dark:bg-cardbg p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <h2 class="font-bold text-sm flex items-center space-x-2">
                <i data-lucide="users" class="w-4 h-4 text-indigo-500"></i>
                <span>Реестр активных учетных записей</span>
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 uppercase font-semibold text-slate-400">
                        <tr>
                            <th class="p-3">ФИО</th>
                            <th class="p-3">Логин</th>
                            <th class="p-3">Роль</th>
                            <th class="p-3 text-right">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable" class="divide-y divide-slate-200 dark:divide-slate-800">
                        <tr>
                            <td class="p-3">Иванов И.И.</td>
                            <td class="p-3">disp1</td>
                            <td class="p-3"><span class="px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded">Диспетчер</span></td>
                            <td class="p-3 text-right"><button class="text-red-400 hover:underline">Отозвать доступ</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
