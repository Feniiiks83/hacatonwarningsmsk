<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Администратора | АО «Москоллектор»</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=your-api-key&lang=ru_RU" type="text/javascript"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { moscow: { blue: '#0066CC', dark: '#0f172a', card: '#1e293b', accent: '#00B4D8', purple: '#7C3AED' } }
                }
            }
        }
    </script>
    <style>
        body { overflow-x: hidden; }
        .icon-sun, .icon-moon { display: none; }
        html.dark .icon-sun { display: block; }
        html:not(.dark) .icon-moon { display: block; }
        .admin-tab.active { background-color: #7C3AED; color: white; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-dark-bg text-gray-900 dark:text-gray-100 h-screen flex flex-col">

    <!-- Top Admin Navigation -->
    <nav class="h-16 bg-white dark:bg-dark-card border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 shrink-0 z-40">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-moscow-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
            </svg>
            <div>
                <span class="font-bold text-lg block leading-tight">Панель Администратора</span>
                <span class="text-xs text-gray-500 dark:text-gray-400">АО «Москоллектор»</span>
            </div>
            <span class="px-2 py-0.5 rounded text-xs bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200 font-bold ml-2">ADMIN</span>
        </div>

        <div class="flex items-center gap-3">
            <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                <svg class="icon-sun w-5 h-5 text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg class="icon-moon w-5 h-5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button id="logoutBtn" class="text-red-500 font-semibold text-sm px-3 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20">Выход</button>
        </div>
    </nav>

    <!-- Top Admin Tabs Bar -->
    <div class="flex border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-dark-card px-6 shrink-0 overflow-x-auto">
        <button onclick="switchAdminTab('monitoring')" id="admin-tab-monitoring" class="admin-tab active px-6 py-3.5 font-semibold text-sm transition flex items-center gap-2">
            Ситуационный мониторинг
        </button>
        <button onclick="switchAdminTab('users')" id="admin-tab-users" class="admin-tab px-6 py-3.5 font-semibold text-sm text-gray-500 transition flex items-center gap-2">
            Управление персоналом
        </button>
        <button onclick="switchAdminTab('settings')" id="admin-tab-settings" class="admin-tab px-6 py-3.5 font-semibold text-sm text-gray-500 transition flex items-center gap-2">
            Системные настройки
        </button>
    </div>

    <!-- MAIN ADMIN CONTENT -->
    <div class="flex-1 overflow-hidden relative">
        
        <!-- MONITORING VIEW -->
        <div id="admin-view-monitoring" class="h-full p-4 overflow-y-auto">
            <p class="text-sm text-gray-500 mb-4">Административный просмотр системы мониторинга в реальном времени</p>
            <div id="map-container" class="w-full h-96 rounded-xl border border-gray-200 dark:border-gray-700"></div>
        </div>

        <!-- USERS MANAGEMENT VIEW -->
        <div id="admin-view-users" class="h-full hidden overflow-y-auto p-6 bg-gray-50 dark:bg-dark-bg">
            <div class="max-w-6xl mx-auto space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold">Управление учетными записями</h2>
                    <button onclick="addUser()" class="bg-moscow-purple hover:bg-purple-700 text-white font-semibold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-purple-500/30">
                        + Добавить пользователя
                    </button>
                </div>

                <div class="bg-white dark:bg-dark-card rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden shadow-sm">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 dark:bg-gray-800 text-gray-500 text-xs uppercase">
                            <tr>
                                <th class="p-4">ФИО</th>
                                <th class="p-4">Логин</th>
                                <th class="p-4">Роль</th>
                                <th class="p-4">Статус</th>
                                <th class="p-4 text-right">Действие</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="admin-view-settings" class="h-full hidden p-6 overflow-y-auto">
            <div class="max-w-3xl mx-auto bg-white dark:bg-dark-card p-6 rounded-xl border border-gray-200 dark:border-gray-700 space-y-4">
                <h2 class="text-xl font-bold">Настройки предиктивной аналитики</h2>
                <div>
                    <label class="block text-sm font-semibold mb-1">Порог срабатывания ML (Precision Threshold)</label>
                    <input type="range" min="50" max="99" value="85" class="w-full">
                </div>
                <button class="bg-moscow-purple text-white px-4 py-2 rounded-lg font-semibold text-xs">Сохранить параметры</button>
            </div>
        </div>

    </div>

    <script>
        const DataStore = {
            KEYS: { USERS: 'ls_users', SESSION: 'ls_session', THEME: 'ls_theme' },
            getUsers() { return JSON.parse(localStorage.getItem(this.KEYS.USERS) || '[]'); },
            getSession() { return JSON.parse(localStorage.getItem(this.KEYS.SESSION) || 'null'); },
            logout() { localStorage.removeItem(this.KEYS.SESSION); },
            getTheme() { return localStorage.getItem(this.KEYS.THEME) || 'dark'; },
            setTheme(t) { localStorage.setItem(this.KEYS.THEME, t); }
        };

        const session = DataStore.getSession();
        if (!session || session.role !== 'admin') window.location.href = 'index.html';

        const html = document.documentElement;
        function applyTheme(t) { t === 'light' ? html.classList.remove('dark') : html.classList.add('dark'); }
        applyTheme(DataStore.getTheme());

        document.getElementById('themeToggle').addEventListener('click', () => {
            const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(newTheme);
            DataStore.setTheme(newTheme);
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            DataStore.logout();
            window.location.href = 'index.html';
        });

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`admin-tab-${tab}`).classList.add('active');

            document.getElementById('admin-view-monitoring').classList.add('hidden');
            document.getElementById('admin-view-users').classList.add('hidden');
            document.getElementById('admin-view-settings').classList.add('hidden');

            document.getElementById(`admin-view-${tab}`).classList.remove('hidden');
            if(tab === 'users') renderUsersTable();
        }

        function renderUsersTable() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            DataStore.getUsers().forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-bold">${u.fullName}</td>
                    <td class="p-4 font-mono text-xs">${u.login}</td>
                    <td class="p-4"><span class="px-2 py-0.5 rounded text-xs font-bold ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">${u.role}</span></td>
                    <td class="p-4 text-xs font-semibold text-green-500">Активен</td>
                    <td class="p-4 text-right"><button class="text-xs text-red-500">Заблокировать</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addUser() {
            alert('Форма быстрого создания пользователя готова к подключению API.');
        }

        window.onload = () => {
            ymaps.ready(() => {
                new ymaps.Map("map-container", { center: [55.751244, 37.618423], zoom: 11 });
            });
        };
    </script>
</body>
</html>
