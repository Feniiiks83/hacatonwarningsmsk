<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ситуационный центр | Диспетчер - АО «Москоллектор»</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#0f172a',
                        'dark-card': '#1e293b',
                        moscow: {
                            blue: '#0066CC',
                            dark: '#0f172a',
                            card: '#1e293b',
                            accent: '#00B4D8'
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.3s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { overflow: hidden; transition: background-color 0.3s ease, color 0.3s ease; }
        
        .resizer {
            width: 5px;
            cursor: col-resize;
            background-color: transparent;
            transition: background-color 0.2s;
            z-index: 30;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
        }
        .resizer:hover, .resizer.resizing {
            background-color: #0066CC;
        }
        
        #map-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            flex: 1;
            min-width: 300px;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            align-content: start;
        }
        
        .icon-sun, .icon-moon { display: none; }
        html.dark .icon-sun { display: block; }
        html:not(.dark) .icon-moon { display: block; }
        
        .tab-btn.active {
            background-color: #0066CC;
            color: white;
            border-bottom: 2px solid #00B4D8;
        }
        .dark .tab-btn.active {
            background-color: #1e293b;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-dark-bg text-gray-900 dark:text-gray-100 h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="h-16 bg-white dark:bg-dark-card border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 shrink-0 z-40 shadow-sm">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-moscow-blue dark:text-moscow-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <div>
                <span class="font-bold text-lg block leading-tight">Ситуационный центр</span>
                <span class="text-xs text-gray-500 dark:text-gray-400">Рабочее место диспетчера</span>
            </div>
            <span class="px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 ml-2 font-medium">DISPATCHER</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="hidden md:flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400 mr-4">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                </svg>
                <span id="currentTime">--:--:--</span>
            </div>
            <button id="themeToggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition" aria-label="Переключить тему">
                <svg class="icon-sun w-5 h-5 text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <svg class="icon-moon w-5 h-5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button id="logoutBtn" class="flex items-center gap-2 text-red-500 hover:text-red-600 font-medium px-3 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3"/>
                </svg>
                Выход
            </button>
        </div>
    </nav>

    <!-- Content Area -->
    <div class="flex-1 overflow-hidden relative flex">
        <div id="left-panel" class="h-full relative bg-gray-200 dark:bg-gray-800" style="width: 60%;">
            <div id="map-container" class="w-full h-full"></div>
            
            <!-- Map Overlay -->
            <div class="absolute top-4 left-4 bg-white/95 dark:bg-dark-card/95 backdrop-blur p-4 rounded-xl shadow-xl z-10 max-w-xs border border-gray-200 dark:border-gray-700">
                <h4 class="font-bold text-sm mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4 text-green-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                    </svg>
                    Мониторинг сети
                </h4>
                <div class="space-y-1 text-xs">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                        <span class="text-red-600 dark:text-red-400 font-bold"><span id="criticalCount">0</span> критических</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                        <span class="text-orange-600 dark:text-orange-400 font-bold"><span id="warningCount">0</span> предупреждений</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="drag-handle" class="resizer" style="left: 60%;"></div>
        
        <div id="right-panel" class="h-full bg-white dark:bg-dark-card border-l border-gray-200 dark:border-gray-700 flex flex-col min-w-[320px]" style="width: 40%;">
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/30">
                <input type="text" id="searchInput" oninput="renderCards()" placeholder="Поиск по датчику или адресу..." class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-moscow-blue">
            </div>

            <div class="flex border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50">
                <button onclick="switchAlertTab('active')" id="alert-tab-active" class="tab-btn active flex-1 px-4 py-3 font-medium text-sm transition">
                    Активные <span id="activeBadge" class="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full ml-1">0</span>
                </button>
                <button onclick="switchAlertTab('resolved')" id="alert-tab-resolved" class="tab-btn flex-1 px-4 py-3 font-medium text-sm text-gray-500 dark:text-gray-400 transition">
                    Завершенные <span id="resolvedBadge" class="bg-green-500 text-white text-xs font-bold px-2 py-0.5 rounded-full ml-1">0</span>
                </button>
            </div>

            <div id="alerts-container" class="flex-1 overflow-y-auto p-4 cards-grid"></div>
            
            <div id="empty-state" class="hidden flex-1 flex items-center justify-center p-8">
                <div class="text-center text-gray-400 dark:text-gray-500">
                    <svg class="w-16 h-16 mx-auto mb-4 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <p class="text-lg font-medium">События не найдены</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Process Alert -->
    <div id="processModal" onclick="handleModalBackdropClick(event)" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-dark-card w-full max-w-lg rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-fade-in" onclick="event.stopPropagation()">
            <div class="p-6 border-b border-gray-200 dark:border-gray-700 bg-gradient-to-r from-red-50 to-orange-50 dark:from-red-900/20 dark:to-orange-900/20">
                <h3 class="text-xl font-bold text-red-600 dark:text-red-400 flex items-center gap-2">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    Реагирование на инцидент
                </h3>
                <p id="modalLocation" class="text-sm text-gray-600 dark:text-gray-400 mt-2 pl-8">Локация...</p>
            </div>
            <div class="p-6 overflow-y-auto">
                <div class="mb-5">
                    <label class="block text-sm font-semibold mb-3">Принимаемое решение</label>
                    <div class="space-y-2">
                        <label class="flex items-start p-4 border border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800">
                            <input type="radio" name="action" value="brigade" class="w-5 h-5 text-moscow-blue mt-0.5" checked>
                            <div class="ml-3">
                                <span class="block text-sm font-medium">Отправить аварийную бригаду</span>
                                <span class="block text-xs text-gray-500">Экстренный выезд на объект</span>
                            </div>
                        </label>
                        <label class="flex items-start p-4 border border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800">
                            <input type="radio" name="action" value="specialist" class="w-5 h-5 text-moscow-blue mt-0.5">
                            <div class="ml-3">
                                <span class="block text-sm font-medium">Запросить диагноста</span>
                                <span class="block text-xs text-gray-500">Проверка датчиков и линий связи</span>
                            </div>
                        </label>
                        <label class="flex items-start p-4 border border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800">
                            <input type="radio" name="action" value="monitor" class="w-5 h-5 text-moscow-blue mt-0.5">
                            <div class="ml-3">
                                <span class="block text-sm font-medium">Взять на усиленный контроль</span>
                                <span class="block text-xs text-gray-500">Отслеживание динамики параметров</span>
                            </div>
                        </label>
                        <label class="flex items-start p-4 border border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800">
                            <input type="radio" name="action" value="false_alarm" class="w-5 h-5 text-moscow-blue mt-0.5">
                            <div class="ml-3">
                                <span class="block text-sm font-medium">Ложная тревога</span>
                                <span class="block text-xs text-gray-500">Сбой при передаче телеметрии</span>
                            </div>
                        </label>
                    </div>
                </div>
                <textarea id="commentInput" rows="3" class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 outline-none focus:ring-2 focus:ring-moscow-blue resize-none text-sm" placeholder="Введите примечание или номер наряда..."></textarea>
            </div>
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">Отмена</button>
                <button id="saveDecisionBtn" class="px-6 py-2.5 rounded-lg bg-moscow-blue hover:bg-blue-700 text-white font-medium transition">Подтвердить</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-white dark:bg-dark-card border-l-4 border-green-500 rounded-lg shadow-2xl p-4 z-[110] hidden animate-fade-in max-w-md">
        <div class="flex items-start gap-3">
            <svg class="w-6 h-6 text-green-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <div>
                <h4 class="font-bold text-gray-900 dark:text-gray-100">Статус обновлен</h4>
                <p id="toastMessage" class="text-sm text-gray-600 dark:text-gray-400 mt-1"></p>
            </div>
        </div>
    </div>

    <script>
        const DataStore = {
            KEYS: { USERS: 'ls_users', EVENTS: 'ls_events', SESSION: 'ls_session', THEME: 'ls_theme' },

            getEvents() { return JSON.parse(localStorage.getItem(this.KEYS.EVENTS) || '[]'); },

            resolveEvent(eventId, userId, resolution) {
                const events = this.getEvents();
                const event = events.find(e => e.id === eventId);
                if (event) {
                    event.status = 'resolved';
                    event.resolvedAt = new Date().toISOString();
                    event.resolvedBy = userId;
                    event.resolution = resolution;
                    localStorage.setItem(this.KEYS.EVENTS, JSON.stringify(events));
                    return true;
                }
                return false;
            },

            getSession() { return JSON.parse(localStorage.getItem(this.KEYS.SESSION) || 'null'); },
            logout() { localStorage.removeItem(this.KEYS.SESSION); },
            getTheme() { return localStorage.getItem(this.KEYS.THEME) || 'dark'; },
            setTheme(theme) { localStorage.setItem(this.KEYS.THEME, theme); }
        };

        const session = DataStore.getSession();
        if (!session || (session.role !== 'dispatcher' && session.role !== 'admin')) {
            window.location.href = 'index.html';
        }

        const html = document.documentElement;
        applyTheme(DataStore.getTheme());

        function applyTheme(theme) {
            if (theme === 'light') html.classList.remove('dark');
            else html.classList.add('dark');
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(newTheme);
            DataStore.setTheme(newTheme);
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            DataStore.logout();
            window.location.href = 'index.html';
        });

        function updateTime() {
            const timeEl = document.getElementById('currentTime');
            if (timeEl) timeEl.textContent = new Date().toLocaleTimeString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        let myMap = null;
        let currentAlertId = null;
        let alertTab = 'active';

        function initMap() {
            if (typeof ymaps === 'undefined') {
                const mapBox = document.getElementById('map-container');
                if (mapBox) {
                    mapBox.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full p-6 text-center text-gray-500">
                            <svg class="w-12 h-12 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A2 2 0 013 15.382V5.618a2 2 0 011.053-1.764l5-2.5a2 2 0 011.894 0l5.5 2.75 5.5-2.75A2 2 0 0121 3.618v9.764a2 2 0 01-1.053 1.764l-5 2.5a2 2 0 01-1.894 0L9 20z"/></svg>
                            <p class="font-semibold text-lg">Карта недоступна в автономном режиме</p>
                            <p class="text-sm">Используйте список событий справа</p>
                        </div>`;
                }
                return;
            }
            ymaps.ready(() => {
                myMap = new ymaps.Map("map-container", {
                    center: [55.751244, 37.618423],
                    zoom: 11,
                    controls: ['zoomControl', 'fullscreenControl']
                });
                myMap.container.fitToViewport();
                renderMarkers();
            });
        }

        function renderMarkers() {
            if (!myMap) return;
            myMap.geoObjects.removeAll();
            const events = DataStore.getEvents();
            events.forEach(event => {
                if (event.status === 'resolved') return;
                let color = event.severity === 'critical' ? 'red' : (event.severity === 'warning' ? 'orange' : 'green');
                const placemark = new ymaps.Placemark(event.coords, {
                    balloonContentHeader: `<strong>${event.title}</strong>`,
                    balloonContentBody: `<p><strong>Датчик:</strong> ${event.sensor}</p><p><strong>Вероятность:</strong> ${event.probability}%</p><button onclick="window.openModalFromMap(${event.id})" style="margin-top:8px;background:#0066CC;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">Принять решение</button>`,
                    balloonContentFooter: event.location
                }, { preset: `islands#${color}DotIcon` });
                myMap.geoObjects.add(placemark);
            });
        }

        window.switchAlertTab = (tab) => {
            alertTab = tab;
            document.getElementById('alert-tab-active').classList.toggle('active', tab === 'active');
            document.getElementById('alert-tab-resolved').classList.toggle('active', tab === 'resolved');
            renderCards();
        };

        function renderCards() {
            const container = document.getElementById('alerts-container');
            const emptyState = document.getElementById('empty-state');
            const query = (document.getElementById('searchInput').value || '').toLowerCase();
            container.innerHTML = '';
            
            const events = DataStore.getEvents();
            let filtered = alertTab === 'active' ? events.filter(e => e.status === 'active') : events.filter(e => e.status === 'resolved');

            if (query) {
                filtered = filtered.filter(e => 
                    e.title.toLowerCase().includes(query) || 
                    e.location.toLowerCase().includes(query) || 
                    e.sensor.toLowerCase().includes(query)
                );
            }

            document.getElementById('activeBadge').textContent = events.filter(e => e.status === 'active').length;
            document.getElementById('resolvedBadge').textContent = events.filter(e => e.status === 'resolved').length;
            document.getElementById('criticalCount').textContent = events.filter(e => e.status === 'active' && e.severity === 'critical').length;
            document.getElementById('warningCount').textContent = events.filter(e => e.status === 'active' && e.severity === 'warning').length;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                container.classList.add('hidden');
                return;
            }
            emptyState.classList.add('hidden');
            container.classList.remove('hidden');

            filtered.forEach(event => {
                const isCritical = event.severity === 'critical';
                const borderColor = isCritical ? 'border-l-red-500' : 'border-l-orange-500';
                const card = document.createElement('div');
                card.className = `p-5 rounded-xl border-l-4 shadow-sm bg-white dark:bg-dark-card border-gray-200 dark:border-gray-700 ${borderColor} cursor-pointer hover:shadow-md transition`;
                card.onclick = () => openModal(event.id);
                card.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="text-xs font-bold uppercase ${isCritical ? 'text-red-500' : 'text-orange-500'}">${event.title}</span>
                        <span class="text-xs text-gray-400">${event.status === 'resolved' ? 'Завершено' : event.forecast}</span>
                    </div>
                    <h4 class="font-bold text-lg mb-1">${event.location}</h4>
                    <p class="text-sm text-gray-500 mb-3">${event.sensor}</p>
                    <div class="flex justify-between items-center pt-3 border-t border-gray-100 dark:border-gray-700">
                        <span class="text-xs bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded">Вероятность: <strong>${event.probability}%</strong></span>
                        ${event.status === 'active' ? '<button class="text-moscow-blue text-sm font-medium">Реагировать →</button>' : '<span class="text-xs text-green-500">✓ Выполнено</span>'}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.openModal = (id) => {
            currentAlertId = id;
            const event = DataStore.getEvents().find(e => e.id === id);
            if (event) {
                document.getElementById('modalLocation').textContent = `${event.title} — ${event.location}`;
                document.getElementById('processModal').classList.remove('hidden');
            }
        };
        window.openModalFromMap = (id) => openModal(id);
        window.closeModal = () => {
            document.getElementById('processModal').classList.add('hidden');
            currentAlertId = null;
            document.getElementById('commentInput').value = '';
        };

        window.handleModalBackdropClick = (e) => {
            if (e.target.id === 'processModal') closeModal();
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('saveDecisionBtn').addEventListener('click', () => {
            if (!currentAlertId) return;
            const checkedRadio = document.querySelector('input[name="action"]:checked');
            const action = checkedRadio ? checkedRadio.value : 'monitor';
            const comment = document.getElementById('commentInput').value.trim();
            const resolution = { action, comment };
            if (DataStore.resolveEvent(currentAlertId, session ? session.login : 'dispatcher', resolution)) {
                closeModal();
                renderCards();
                renderMarkers();
                showToast('Решение зафиксировано в журнале');
            }
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // Resizable Split Panel
        const leftPanel = document.getElementById('left-panel');
        const rightPanel = document.getElementById('right-panel');
        const resizer = document.getElementById('drag-handle');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            resizer.classList.add('resizing');
            document.body.style.userSelect = 'none';
            if (myMap) myMap.behaviors.disable('drag');
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const w = ((document.body.clientWidth - e.clientX) / document.body.clientWidth) * 100;
            if (w >= 20 && w <= 70) {
                rightPanel.style.width = `${w}%`;
                leftPanel.style.width = `${100 - w}%`;
                resizer.style.left = `${100 - w}%`;
                if (myMap) myMap.container.fitToViewport();
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('resizing');
                document.body.style.userSelect = '';
                if (myMap) myMap.behaviors.enable('drag');
                if (myMap) myMap.container.fitToViewport();
            }
        });

        window.addEventListener('load', () => {
            initMap();
            renderCards();
        });

        window.addEventListener('resize', () => {
            if (myMap) myMap.container.fitToViewport();
        });

        window.addEventListener('storage', () => {
            renderCards();
            renderMarkers();
        });
    </script>
</body>
</html>
