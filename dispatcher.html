<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диспетчерская | Ситуационный центр АО «Москоллектор»</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Яндекс Карта API v2.1 -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&load=package.full" type="text/javascript"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        moscow: {
                            blue: '#0066CC',
                            dark: '#0f172a',
                            card: '#1e293b',
                            accent: '#00B4D8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .icon-sun, .icon-moon { display: none; }
        html.dark .icon-sun { display: block; }
        html:not(.dark) .icon-moon { display: block; }
        .splitter { width: 6px; cursor: col-resize; background-color: #334155; transition: background-color 0.2s; }
        .splitter:hover, .splitter.active { background-color: #00B4D8; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen flex flex-col overflow-hidden">

    <!-- Header Panel -->
    <header class="h-16 bg-slate-800/90 backdrop-blur border-b border-slate-700/80 px-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-moscow-blue/20 rounded-xl flex items-center justify-center border border-moscow-blue/40">
                <svg class="w-5 h-5 text-moscow-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white leading-tight">АО «Москоллектор»</h1>
                <p class="text-[11px] text-slate-400">Рабочее место диспетчера • Ситуационный центр</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- ML Update Forecast Button -->
            <button id="btnUpdateForecast" onclick="triggerMLUpdate()" class="flex items-center gap-2 px-3 py-1.5 bg-blue-600/20 hover:bg-blue-600/30 text-moscow-accent border border-blue-500/30 rounded-lg text-xs font-medium transition">
                <svg class="w-4 h-4 animate-spin-slow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 3.87-8.57L2.1 8"/>
                </svg>
                <span>Обновить прогноз ML</span>
            </button>

            <!-- Sound Mute/Unmute Toggle Button -->
            <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 rounded-lg bg-slate-700/80 hover:bg-slate-600 text-slate-300 transition" title="Включить/Выключить звук">
                <!-- Icon injected dynamically -->
            </button>

            <!-- Theme Toggle Button -->
            <button id="themeToggle" class="p-2 rounded-lg bg-slate-700/80 hover:bg-slate-600 text-slate-300 transition" aria-label="Переключить тему">
                <svg class="icon-sun w-5 h-5 text-yellow-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <svg class="icon-moon w-5 h-5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>

            <div class="h-6 w-px bg-slate-700"></div>

            <!-- User Info & Logout -->
            <div class="flex items-center gap-2">
                <div class="text-right hidden sm:block">
                    <p id="dispUserName" class="text-xs font-semibold text-white">Диспетчер Смены</p>
                    <p class="text-[10px] text-green-400 flex items-center justify-end gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> В сети
                    </p>
                </div>
                <button onclick="logout()" class="p-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg transition" title="Выйти из системы">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace Split Container -->
    <div id="workspace" class="flex flex-1 overflow-hidden relative">
        
        <!-- Left Panel: Interactive Yandex Map -->
        <div id="mapPanel" class="relative overflow-hidden flex flex-col" style="width: 55%; min-width: 320px;">
            <div id="map" class="w-full h-full bg-slate-950"></div>

            <!-- Map Controls Overlay -->
            <div class="absolute top-3 left-3 z-10 flex flex-wrap gap-2">
                <!-- Heatmap Toggle Button -->
                <button id="heatmapToggleBtn" onclick="toggleHeatmap()" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800/90 hover:bg-slate-700 text-xs text-white rounded-lg border border-slate-600/80 backdrop-blur shadow-lg transition">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
                    <span>🔥 Тепловая карта: <strong id="heatmapStatus">ВКЛ</strong></span>
                </button>
            </div>

            <!-- Legend Overlay -->
            <div class="absolute bottom-4 left-4 z-10 bg-slate-800/90 backdrop-blur border border-slate-700 p-2.5 rounded-xl text-xs space-y-1.5 shadow-xl">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500"></span>
                    <span class="text-slate-200">Критический риск (&gt;80%)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                    <span class="text-slate-200">Предупреждение (50-80%)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                    <span class="text-slate-200">Норма (&lt;50%)</span>
                </div>
            </div>
        </div>

        <!-- Splitter Resizer -->
        <div id="splitter" class="splitter"></div>

        <!-- Right Panel: Events & Sensor Stream Feed -->
        <div id="feedPanel" class="flex-1 bg-slate-900 flex flex-col min-w-[320px] overflow-hidden">
            
            <!-- Filters & Export Toolbar -->
            <div class="p-3 bg-slate-800/60 border-b border-slate-700/80 flex flex-wrap items-center justify-between gap-2 shrink-0">
                <div class="flex items-center gap-2 flex-1 min-w-[200px]">
                    <input type="text" id="searchInput" oninput="renderEvents()" placeholder="Поиск по объекту или локации..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-moscow-accent">
                    <select id="severityFilter" onchange="renderEvents()" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-moscow-accent">
                        <option value="all">Все риски</option>
                        <option value="critical">🚨 Критические</option>
                        <option value="warning">⚠️ Предупреждения</option>
                        <option value="normal">✅ Норма</option>
                    </select>
                </div>

                <!-- Export Options Dropdown Button -->
                <div class="relative group">
                    <button class="flex items-center gap-1.5 bg-moscow-blue hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        <span>Экспорт</span>
                    </button>
                    <div class="absolute right-0 mt-1 w-36 bg-slate-800 border border-slate-700 rounded-lg shadow-xl opacity-0 group-hover:opacity-100 transition duration-150 pointer-events-none group-hover:pointer-events-auto z-30">
                        <button onclick="exportToExcel()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-slate-700 rounded-t-lg flex items-center gap-2">
                            <span>📊 в Excel (.csv)</span>
                        </button>
                        <button onclick="exportToPDF()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-slate-700 rounded-b-lg flex items-center gap-2">
                            <span>📄 в PDF (Печать)</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Event Cards Grid Stream -->
            <div id="eventsContainer" class="p-3 overflow-y-auto flex-1 grid grid-cols-1 gap-3 content-start">
                <!-- Cards injected here via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Response Modal Window -->
    <div id="responseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl animate-fade-in">
            <div class="p-4 bg-slate-900/80 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modalTitle" class="text-sm font-bold text-white">Обработка сигнала инцидента</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <form id="responseForm" onsubmit="submitResponse(event)" class="p-5 space-y-4">
                <input type="hidden" id="modalEventId">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Выбор управляющего действия:</label>
                    <div class="space-y-2 text-xs">
                        <label class="flex items-center gap-2 p-2.5 rounded-lg bg-slate-900/60 border border-slate-700 cursor-pointer hover:border-blue-500">
                            <input type="radio" name="action" value="dispatch_crew" checked class="text-moscow-blue">
                            <span>Вызов аварийно-ремонтной бригады</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-lg bg-slate-900/60 border border-slate-700 cursor-pointer hover:border-blue-500">
                            <input type="radio" name="action" value="inspect" class="text-moscow-blue">
                            <span>Направление специалиста для физической проверки</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-lg bg-slate-900/60 border border-slate-700 cursor-pointer hover:border-blue-500">
                            <input type="radio" name="action" value="monitor" class="text-moscow-blue">
                            <span>Продолжить мониторинг (повышенное внимание)</span>
                        </label>
                        <label class="flex items-center gap-2 p-2.5 rounded-lg bg-slate-900/60 border border-slate-700 cursor-pointer hover:border-blue-500">
                            <input type="radio" name="action" value="false_alarm" class="text-moscow-blue">
                            <span>Ложное срабатывание (ошибка датчика / регламент)</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Комментарий диспетчера:</label>
                    <textarea id="modalComment" rows="3" required placeholder="Укажите подробности принятого решения..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-moscow-blue"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 rounded-lg">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-moscow-blue hover:bg-blue-600 text-xs font-bold text-white rounded-lg shadow">Сохранить решение</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-800 border border-moscow-accent text-white text-xs px-4 py-3 rounded-xl shadow-2xl transition transform translate-y-20 opacity-0 flex items-center gap-2">
        <span id="toastIcon">ℹ️</span>
        <span id="toastMsg">Сообщение</span>
    </div>

    <script>
        // Data Store & State Management
        const DataStore = {
            KEYS: { USERS: 'ls_users', EVENTS: 'ls_events', SESSION: 'ls_session', SOUND: 'ls_sound_muted' },
            getEvents() {
                return JSON.parse(localStorage.getItem(this.KEYS.EVENTS) || '[]');
            },
            saveEvents(events) {
                localStorage.setItem(this.KEYS.EVENTS, JSON.stringify(events));
            }
        };

        // Check Authorization
        const session = JSON.parse(localStorage.getItem(DataStore.KEYS.SESSION) || 'null');
        if (!session) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('dispUserName').textContent = session.fullName || session.login;
        }

        function logout() {
            localStorage.removeItem(DataStore.KEYS.SESSION);
            window.location.href = 'index.html';
        }

        // Sound System (Web Audio Synth Beep)
        let soundMuted = localStorage.getItem(DataStore.KEYS.SOUND) === 'true';

        function updateSoundButtonUI() {
            const btn = document.getElementById('soundToggleBtn');
            if (soundMuted) {
                btn.innerHTML = `<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>`;
            } else {
                btn.innerHTML = `<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>`;
            }
        }
        updateSoundButtonUI();

        function toggleSound() {
            soundMuted = !soundMuted;
            localStorage.setItem(DataStore.KEYS.SOUND, soundMuted);
            updateSoundButtonUI();
            showToast(soundMuted ? 'Звук отключен' : 'Звук включен');
        }

        function playCriticalAlertSound() {
            if (soundMuted) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.35, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } catch(e) { console.warn('Audio play block:', e); }
        }

        // Map & Heatmap Variables
        let myMap = null;
        let heatmapInstance = null;
        let heatmapActive = true;
        let mapPlacemarks = [];

        ymaps.ready(initMap);

        function initMap() {
            myMap = new ymaps.Map('map', {
                center: [55.751244, 37.618423],
                zoom: 11,
                controls: ['zoomControl', 'fullscreenControl']
            });

            myMap.container.fitToViewport();
            updateMapMarkers();
            initHeatmap();
        }

        function initHeatmap() {
            if (!myMap || !window.ymaps) return;
            ymaps.modules.require(['Heatmap'], function (Heatmap) {
                const events = DataStore.getEvents();
                const data = {
                    type: 'FeatureCollection',
                    features: events.map(e => ({
                        type: 'Feature',
                        id: e.id,
                        geometry: { type: 'Point', coordinates: e.coords },
                        properties: { weight: e.probability / 100 }
                    }))
                };

                if (heatmapInstance) {
                    heatmapInstance.destroy();
                }

                heatmapInstance = new Heatmap(data, {
                    radius: 30,
                    dissipating: true,
                    opacity: 0.75,
                    intensityOfMidpoint: 0.2
                });

                if (heatmapActive) {
                    heatmapInstance.setMap(myMap);
                }
            });
        }

        function toggleHeatmap() {
            heatmapActive = !heatmapActive;
            document.getElementById('heatmapStatus').textContent = heatmapActive ? 'ВКЛ' : 'ВЫКЛ';
            if (heatmapInstance) {
                heatmapInstance.setMap(heatmapActive ? myMap : null);
            }
            showToast(heatmapActive ? 'Тепловая карта включена' : 'Тепловая карта отключена');
        }

        function updateMapMarkers() {
            if (!myMap) return;
            
            // Clear existing placemarks
            mapPlacemarks.forEach(p => myMap.geoObjects.remove(p));
            mapPlacemarks = [];

            const events = DataStore.getEvents();
            events.forEach(item => {
                let color = item.severity === 'critical' ? '#ef4444' : (item.severity === 'warning' ? '#f59e0b' : '#10b981');
                if (item.status === 'processed') color = '#64748b';

                const pm = new ymaps.Placemark(item.coords, {
                    balloonContentHeader: `<strong style="color:${color}">${item.title}</strong>`,
                    balloonContentBody: `<div>${item.location}<br><small>Риск: ${item.probability}%</small></div>`
                }, {
                    preset: 'islands#circleDotIcon',
                    iconColor: color
                });

                myMap.geoObjects.add(pm);
                mapPlacemarks.push(pm);
            });
        }

        // Render Events Stream Feed
        function renderEvents() {
            const container = document.getElementById('eventsContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const severityFilter = document.getElementById('severityFilter').value;
            const events = DataStore.getEvents();

            const filtered = events.filter(e => {
                const matchSearch = e.title.toLowerCase().includes(search) || e.location.toLowerCase().includes(search) || e.sensor.toLowerCase().includes(search);
                const matchSeverity = severityFilter === 'all' || e.severity === severityFilter;
                return matchSearch && matchSeverity;
            });

            container.innerHTML = '';
            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8 text-xs">Нет инцидентов, удовлетворяющих фильтрам</div>`;
                return;
            }

            filtered.forEach(item => {
                const isCritical = item.severity === 'critical';
                const isWarning = item.severity === 'warning';
                const isProcessed = item.status === 'processed';

                let borderClass = isCritical ? 'border-red-500/50 bg-red-500/5' : (isWarning ? 'border-amber-500/50 bg-amber-500/5' : 'border-slate-700 bg-slate-800/80');
                let badgeClass = isCritical ? 'bg-red-500/20 text-red-400 border-red-500/30' : (isWarning ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30');

                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border ${borderClass} shadow-lg transition flex flex-col justify-between gap-2 relative overflow-hidden`;
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <span class="inline-block px-2 py-0.5 text-[10px] rounded-md font-semibold border ${badgeClass} mb-1">
                                ${isCritical ? '🚨 КРИТИЧЕСКИЙ РИСК' : (isWarning ? '⚠️ ПРЕДУПРЕЖДЕНИЕ' : '✅ НОРМА')}
                            </span>
                            <h4 class="font-bold text-xs text-white leading-snug">${item.title}</h4>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-xs font-mono font-bold ${isCritical ? 'text-red-400' : 'text-amber-400'}">${item.probability}%</span>
                            <p class="text-[10px] text-slate-400">${item.forecast}</p>
                        </div>
                    </div>

                    <div class="text-[11px] text-slate-300 space-y-1">
                        <p class="flex items-center gap-1.5"><span class="text-slate-400">📍 Локация:</span> ${item.location}</p>
                        <p class="flex items-center gap-1.5"><span class="text-slate-400">📡 Датчик:</span> ${item.sensor}</p>
                        ${item.responseComment ? `<p class="text-[10px] text-blue-300 bg-blue-900/30 p-1.5 rounded border border-blue-800/40 mt-1">💬 Решение: ${item.responseComment}</p>` : ''}
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-slate-700/50">
                        <span class="text-[10px] text-slate-500">${new Date(item.createdAt).toLocaleTimeString('ru-RU')}</span>
                        ${isProcessed ? 
                            `<span class="text-[10px] font-semibold text-slate-400 bg-slate-700/50 px-2.5 py-1 rounded-lg">✓ Обработано</span>` : 
                            `<button onclick="openResponseModal(${item.id})" class="bg-moscow-blue hover:bg-blue-600 text-white text-[11px] font-semibold px-3 py-1 rounded-lg transition shadow">Ответить / Обработать</button>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Response Modal Handler
        function openResponseModal(eventId) {
            document.getElementById('modalEventId').value = eventId;
            document.getElementById('responseComment').value = '';
            document.getElementById('responseModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('responseModal').classList.add('hidden');
        }

        function submitResponse(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('modalEventId').value);
            const comment = document.getElementById('modalComment').value;
            const events = DataStore.getEvents();

            const ev = events.find(x => x.id === id);
            if (ev) {
                ev.status = 'processed';
                ev.responseComment = comment;
                DataStore.saveEvents(events);
                renderEvents();
                updateMapMarkers();
                initHeatmap();
                closeModal();
                showToast('Решение диспетчера сохранено');
            }
        }

        // ML Forecast Simulation & Trigger
        function triggerMLUpdate() {
            const btn = document.getElementById('btnUpdateForecast');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            showToast('Запущен алгоритм предиктивной аналитики ML...', '🤖');

            setTimeout(() => {
                const events = DataStore.getEvents();
                let addedCritical = false;

                // Randomly escalate or add an event
                if (events.length > 0) {
                    const randEv = events[Math.floor(Math.random() * events.length)];
                    randEv.probability = Math.min(99, randEv.probability + 12);
                    if (randEv.probability > 80 && randEv.severity !== 'critical') {
                        randEv.severity = 'critical';
                        addedCritical = true;
                    }
                }

                DataStore.saveEvents(events);
                renderEvents();
                updateMapMarkers();
                initHeatmap();

                if (addedCritical) {
                    playCriticalAlertSound();
                }

                btn.disabled = false;
                btn.classList.remove('opacity-50');
                showToast('Прогноз ML успешно обновлен', '✅');
            }, 1200);
        }

        // Export Functions (Excel & PDF)
        function exportToExcel() {
            const events = DataStore.getEvents();
            let csv = "\uFEFFID;Заголовок;Уровень;Датчик;Локация;Вероятность (%);Горизонт;Статус;Дата\n";
            events.forEach(item => {
                csv += `"${item.id}";"${item.title}";"${item.severity}";"${item.sensor}";"${item.location}";"${item.probability}";"${item.forecast}";"${item.status}";"${new Date(item.createdAt).toLocaleString('ru-RU')}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Москоллектор_Отчет_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Данные выгружены в Excel (CSV)');
        }

        function exportToPDF() {
            const events = DataStore.getEvents();
            const printWin = window.open('', '_blank');
            let rowsHtml = events.map(e => `
                <tr>
                    <td style="border:1px solid #cbd5e1; padding:6px;">${e.id}</td>
                    <td style="border:1px solid #cbd5e1; padding:6px;"><b>${e.title}</b><br><small>${e.sensor}</small></td>
                    <td style="border:1px solid #cbd5e1; padding:6px; color:${e.severity==='critical'?'#dc2626':(e.severity==='warning'?'#d97706':'#16a34a')};"><b>${e.severity.toUpperCase()}</b></td>
                    <td style="border:1px solid #cbd5e1; padding:6px;">${e.location}</td>
                    <td style="border:1px solid #cbd5e1; padding:6px;">${e.probability}%</td>
                    <td style="border:1px solid #cbd5e1; padding:6px;">${e.status}</td>
                </tr>
            `).join('');

            printWin.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Отчет по инцидентам АО «Москоллектор»</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; color: #0f172a; }
                        h2 { color: #0066CC; margin-bottom: 4px; }
                        p { font-size: 11px; color: #64748b; margin-bottom: 16px; }
                        table { width: 100%; border-collapse: collapse; font-size: 12px; }
                        th { background: #0066CC; color: white; border: 1px solid #0066CC; padding: 8px; text-align: left; }
                    </style>
                </head>
                <body>
                    <h2>АО «Москоллектор» — Сменный отчет диспетчера</h2>
                    <p>Дата формирования: ${new Date().toLocaleString('ru-RU')}</p>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Инцидент / Датчик</th>
                                <th>Уровень</th>
                                <th>Локация</th>
                                <th>Риск</th>
                                <th>Статус</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                    <script>window.onload = function() { window.print(); }<\/script>
                </body>
                </html>
            `);
            printWin.document.close();
        }

        // Toast Helper
        function showToast(msg, icon = 'ℹ️') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').textContent = icon;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Splitter Drag Handle Logic
        const splitter = document.getElementById('splitter');
        const mapPanel = document.getElementById('mapPanel');
        let isDragging = false;

        splitter.addEventListener('mousedown', () => {
            isDragging = true;
            splitter.classList.add('active');
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const containerWidth = document.getElementById('workspace').clientWidth;
            let newWidthPercent = (e.clientX / containerWidth) * 100;
            if (newWidthPercent > 20 && newWidthPercent < 80) {
                mapPanel.style.width = `${newWidthPercent}%`;
                if (myMap) myMap.container.fitToViewport();
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                splitter.classList.remove('active');
                if (myMap) myMap.container.fitToViewport();
            }
        });

        // Theme Switcher Logic
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Initial Load
        renderEvents();
    </script>
</body>
</html>
