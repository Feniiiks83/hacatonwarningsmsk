<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | АО «Москоллектор»</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        moscow: { blue: '#0066CC', dark: '#0f172a', card: '#1e293b', accent: '#00B4D8' }
                    }
                }
            }
        }
    </script>
    <style>
        .icon-sun, .icon-moon { display: none; }
        html.dark .icon-sun { display: block; }
        html:not(.dark) .icon-moon { display: block; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-dark-bg text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Theme Toggle Floating Button -->
    <div class="absolute top-4 right-4">
        <button id="themeToggle" class="p-2.5 bg-white dark:bg-dark-card border border-gray-200 dark:border-gray-700 rounded-xl shadow-md hover:bg-gray-50 dark:hover:bg-gray-800 transition">
            <svg class="icon-sun w-5 h-5 text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon w-5 h-5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>

    <!-- Login Container -->
    <div class="w-full max-w-md bg-white dark:bg-dark-card border border-gray-200 dark:border-gray-700 rounded-2xl shadow-2xl p-6 md:p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-50 dark:bg-blue-900/30 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100 dark:border-blue-800/50">
                <svg class="w-10 h-10 text-moscow-blue dark:text-moscow-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">АО «Москоллектор»</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Внутренняя диспетчерская система</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">Логин пользователя</label>
                <input type="text" id="username" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-moscow-blue focus:border-transparent outline-none transition text-sm" placeholder="Введите логин" required autocomplete="username">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">Пароль</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-moscow-blue focus:border-transparent outline-none transition text-sm" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div id="loginError" class="hidden bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 text-xs py-3 px-4 rounded-xl text-center font-medium border border-red-200 dark:border-red-800">
                Неверный логин или пароль
            </div>

            <button type="submit" class="w-full bg-moscow-blue hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30 text-sm">
                Войти в ситуационный центр
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700 text-center">
            <p class="text-xs text-gray-400 mb-2">Тестовые аккаунты:</p>
            <div class="flex justify-center gap-4 text-xs font-mono text-gray-500 dark:text-gray-400">
                <span class="bg-gray-100 dark:bg-gray-800 px-2.5 py-1 rounded">admin / admin123</span>
                <span class="bg-gray-100 dark:bg-gray-800 px-2.5 py-1 rounded">disp1 / disp123</span>
            </div>
        </div>
    </div>

    <script>
        const DataStore = {
            KEYS: { USERS: 'ls_users', EVENTS: 'ls_events', SESSION: 'ls_session', THEME: 'ls_theme' },
            init() {
                if (!localStorage.getItem(this.KEYS.USERS)) {
                    localStorage.setItem(this.KEYS.USERS, JSON.stringify([
                        { id: 1, fullName: 'Администратор Системы', login: 'admin', password: 'admin123', role: 'admin', active: true },
                        { id: 2, fullName: 'Петров Дмитрий Сергеевич', login: 'disp1', password: 'disp123', role: 'dispatcher', active: true }
                    ]));
                }
                if (!localStorage.getItem(this.KEYS.THEME)) localStorage.setItem(this.KEYS.THEME, 'dark');
            },
            authenticate(login, password) {
                const users = JSON.parse(localStorage.getItem(this.KEYS.USERS) || '[]');
                const user = users.find(u => u.login === login && u.password === password && u.active);
                if (user) {
                    localStorage.setItem(this.KEYS.SESSION, JSON.stringify({ userId: user.id, login: user.login, role: user.role, fullName: user.fullName }));
                    return { success: true, role: user.role };
                }
                return { success: false };
            },
            getSession() { return JSON.parse(localStorage.getItem(this.KEYS.SESSION) || 'null'); },
            getTheme() { return localStorage.getItem(this.KEYS.THEME) || 'dark'; },
            setTheme(t) { localStorage.setItem(this.KEYS.THEME, t); }
        };

        DataStore.init();

        const session = DataStore.getSession();
        if (session) {
            window.location.href = session.role === 'admin' ? 'admin.html' : 'dispatcher.html';
        }

        const html = document.documentElement;
        function applyTheme(t) { t === 'light' ? html.classList.remove('dark') : html.classList.add('dark'); }
        applyTheme(DataStore.getTheme());

        document.getElementById('themeToggle').addEventListener('click', () => {
            const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(newTheme);
            DataStore.setTheme(newTheme);
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const res = DataStore.authenticate(document.getElementById('username').value.trim(), document.getElementById('password').value.trim());
            if (res.success) window.location.href = res.role === 'admin' ? 'admin.html' : 'dispatcher.html';
            else document.getElementById('loginError').classList.remove('hidden');
        });
    </script>
</body>
</html>
